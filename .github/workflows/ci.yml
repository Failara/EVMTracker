name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        env:
          WATCHLIST_DB_PASSWORD: validation-only
          INDEXER_DB_PASSWORD: validation-only
          NOTIFICATION_DB_PASSWORD: validation-only
          TELEGRAM_DB_PASSWORD: validation-only
          RABBITMQ_PASSWORD: validation-only
          EVM_RPC_URL: https://rpc.example.invalid
          TELEGRAM_BOT_TOKEN: 123456:validation-only-token-value
          GRAFANA_ADMIN_PASSWORD: validation-only
        run: docker compose --file compose.yaml config --quiet

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EVMTracker.sln --configfile NuGet.Config

      - name: Verify formatting
        run: dotnet format EVMTracker.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build EVMTracker.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EVMTracker.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
